spring.application.name=loan-auth-module
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/LoanApp?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

# IMPORTANT: validate = Hibernate checks the existing DB schema; 33 does not change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT - replace this in your environment with a long random secret.
app.jwt.secret=ChangeThisToARealLongRandomSecretKeyForLoanApplication123456789
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000

# Development email OTP. SMTP is optional for this first backend-only version.
app.otp.expiration-minutes=10

# OAuth2 Google. Put your real values here or as environment variables.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

#EMail otp send

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=email
spring.mail.password=pass

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=http://localhost:4200