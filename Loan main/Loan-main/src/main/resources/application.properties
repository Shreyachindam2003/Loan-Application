spring.application.name=Loan-main
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/LoanApp?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000

spring.otp.expiration-minutes=10

l.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=http://localhost:4200